{% extends 'base.html' %}
{% block title %}Add Shared Expense - {{ group.name }}{% endblock %}
{% block content %}
<div class="auth-page-container">
    <div class="auth-card glass-card" style="max-width: 600px;">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-money-bill-transfer"></i>
            </div>
            <h1 class="auth-title">Add Shared Expense</h1>
            <p class="auth-subtitle">Group: <strong>{{ group.name }}</strong></p>
        </div>

        <form method="POST" class="auth-form" id="sharedExpenseForm" novalidate>
            <div class="form-group">
                <label for="title" class="form-label"><i class="fa-regular fa-comment-dots"></i> Expense Title / Description *</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Resort Booking, Dinner at Fisherman's Wharf, Taxi Fare" value="{{ form_data.title or '' }}" required autofocus>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="amount" class="form-label"><i class="fa-solid fa-indian-rupee-sign"></i> Total Amount (?) *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" value="{{ form_data.amount or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="paid_by" class="form-label"><i class="fa-solid fa-user-check"></i> Paid By *</label>
                    <select id="paid_by" name="paid_by" class="form-control" required>
                        {% for m in members %}
                            <option value="{{ m.user_id }}" {% if (form_data.paid_by|string) == (m.user_id|string) %}selected{% endif %}>{{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="category_id" class="form-label"><i class="fa-solid fa-tag"></i> Category</label>
                    <select id="category_id" name="category_id" class="form-control">
                        <option value="">-- Select Category --</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if (form_data.category_id|string) == (cat.id|string) %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense_date" class="form-label"><i class="fa-regular fa-calendar"></i> Date *</label>
                    <input type="date" id="expense_date" name="expense_date" class="form-control" value="{{ form_data.expense_date or '' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-arrows-split-up-and-left"></i> Split Method</label>
                <div class="split-mode-selector flex-gap mb-3">
                    <label class="btn btn-secondary btn-sm"><input type="radio" name="split_type" value="equal" checked> Equal Split</label>
                    <label class="btn btn-secondary btn-sm"><input type="radio" name="split_type" value="custom"> Custom Amounts</label>
                </div>
            </div>

            <!-- Participants Selector -->
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-users"></i> Included Participants</label>
                <div class="participants-checkbox-list glass-card p-3">
                    {% for m in members %}
                        <div class="participant-row flex-between mb-2">
                            <label class="custom-checkbox-container">
                                <input type="checkbox" name="participants" value="{{ m.user_id }}" checked class="participant-checkbox">
                                <span class="checkmark"></span>
                                <span class="font-medium">{{ m.name }}</span>
                            </label>
                            <input type="number" step="0.01" min="0" name="share_{{ m.user_id }}" class="form-control form-control-sm custom-share-input" placeholder="? Amount" style="max-width: 120px; display: none;">
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div class="mt-4 flex-gap">
                <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-check"></i> Record Shared Expense</button>
                <a href="{{ url_for('groups.group_detail_route', group_id=group.id) }}" class="btn btn-secondary btn-block btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const radios = document.querySelectorAll('input[name="split_type"]');
    const customInputs = document.querySelectorAll('.custom-share-input');

    radios.forEach(radio => {
        radio.addEventListener('change', () => {
            if (radio.value === 'custom') {
                customInputs.forEach(input => input.style.display = 'block');
            } else {
                customInputs.forEach(input => input.style.display = 'none');
            }
        });
    });
});
</script>
{% endblock %}
