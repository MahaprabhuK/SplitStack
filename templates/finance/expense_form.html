{% extends 'base.html' %}
{% block title %}{{ 'Edit Expense' if is_edit else 'Add Expense' }} - SplitStack{% endblock %}
{% block content %}
<div class="auth-page-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid {{ 'fa-pen-to-square' if is_edit else 'fa-receipt' }}"></i>
            </div>
            <h1 class="auth-title">{{ 'Edit Expense' if is_edit else 'Add New Expense' }}</h1>
            <p class="auth-subtitle">Keep your financial records accurate</p>
        </div>

        <form method="POST" class="auth-form" novalidate>
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="amount" class="form-label"><i class="fa-solid fa-indian-rupee-sign"></i> Amount (?) *</label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" value="{{ form_data.amount or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label for="category_id" class="form-label"><i class="fa-solid fa-tag"></i> Category</label>
                <select id="category_id" name="category_id" class="form-control">
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if (form_data.category_id|string) == (cat.id|string) %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description" class="form-label"><i class="fa-regular fa-comment-dots"></i> Description / Note</label>
                <input type="text" id="description" name="description" class="form-control" placeholder="e.g. Groceries, Coffee, Uber Cab" value="{{ form_data.description or '' }}">
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label for="expense_date" class="form-label"><i class="fa-regular fa-calendar"></i> Date *</label>
                    <input type="date" id="expense_date" name="expense_date" class="form-control" value="{{ form_data.expense_date or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="payment_method" class="form-label"><i class="fa-solid fa-credit-card"></i> Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-control">
                        <option value="upi" {% if form_data.payment_method == 'upi' %}selected{% endif %}>UPI</option>
                        <option value="card" {% if form_data.payment_method == 'card' %}selected{% endif %}>Card</option>
                        <option value="cash" {% if form_data.payment_method == 'cash' %}selected{% endif %}>Cash</option>
                        <option value="net_banking" {% if form_data.payment_method == 'net_banking' %}selected{% endif %}>Net Banking</option>
                        <option value="other" {% if form_data.payment_method == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 flex-gap">
                <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fa-solid fa-check"></i> {{ 'Save Changes' if is_edit else 'Record Expense' }}</button>
                <a href="{{ url_for('finance.expenses') }}" class="btn btn-secondary btn-block btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
