{% extends 'base.html' %}

{% block title %}Sign In - SplitStack{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to manage your personal & group finances</p>
        </div>

        <form action="{{ url_for('auth.login', next=next) }}" method="POST" class="auth-form" id="loginForm" novalidate>
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fa-regular fa-envelope"></i> Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="name@example.com" 
                    value="{{ email or '' }}" 
                    required 
                    autocomplete="email"
                    autofocus
                >
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password" class="form-label">
                        <i class="fa-solid fa-lock"></i> Password
                    </label>
                </div>
                <div class="password-input-wrap">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="????????" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="btn-toggle-password" id="togglePasswordBtn" title="Toggle password visibility">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="custom-checkbox-container">
                    <input type="checkbox" name="remember" id="rememberMe">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitLoginBtn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="auth-link">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
