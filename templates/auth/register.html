{% extends 'base.html' %}

{% block title %}Create Account - SplitStack{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Get Started</h1>
            <p class="auth-subtitle">Create your SplitStack account to track and share expenses</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form" id="registerForm" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">
                    <i class="fa-regular fa-user"></i> Full Name
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-control" 
                    placeholder="e.g. Pavithran" 
                    value="{{ name or '' }}" 
                    required 
                    autocomplete="name"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fa-regular fa-envelope"></i> Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="name@example.com" 
                    value="{{ email or '' }}" 
                    required 
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> Password
                </label>
                <div class="password-input-wrap">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="At least 6 characters" 
                        required 
                        autocomplete="new-password"
                    >
                    <button type="button" class="btn-toggle-password" id="toggleRegPasswordBtn" title="Toggle password visibility">
                        <i class="fa-regular fa-eye" id="toggleRegPasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">
                    <i class="fa-solid fa-check-double"></i> Confirm Password
                </label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-control" 
                    placeholder="Re-enter password" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitRegisterBtn">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
